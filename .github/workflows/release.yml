name: Release

# package.json 的 version 有變動並推送到 main 時，
# 在 Windows 上打包並發布到 GitHub Releases（標籤 v<version> 會自動建立）
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx electron-builder --win nsis --x64 --publish never
      - name: 上傳到 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --title "v$V" --notes "上班便利小工具 v$V" --target "$GITHUB_SHA"
          gh release upload "v$V" "dist/FloatingTodo-Setup-$V.exe" "dist/FloatingTodo-Setup-$V.exe.blockmap" --clobber
          gh release upload "v$V" dist/latest.yml --clobber
